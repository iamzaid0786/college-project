<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeatSync | Your sound, your world</title>
<style>
:root{--bg:#090b10;--panel:#12151d;--muted:#9ba3b5;--green:#b7f36b;--line:#272c38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6fa;font-family:Inter,Segoe UI,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr;grid-template-rows:1fr 90px}.side{grid-row:1/3;background:#0c0e14;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:32px}.brand{font-size:24px;font-weight:900;letter-spacing:-1px;padding:0 8px}.brand b{color:var(--green)}.logo{display:inline-grid;place-items:center;background:var(--green);color:#10150a;border-radius:10px;width:32px;height:32px;margin-right:8px}.label{font-size:10px;color:#727b8d;letter-spacing:2px;font-weight:800;padding:0 12px;margin-bottom:9px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:var(--muted);padding:12px;border-radius:9px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:#1a202b;color:white}.nav button.active{color:var(--green)}.hint{margin-top:auto;background:#171c27;border:1px solid #2b3140;padding:15px;border-radius:14px}.hint p{font-size:12px;color:var(--muted);line-height:1.5}.btn{border:0;border-radius:99px;background:var(--green);color:#12170d;padding:11px 18px;font-weight:850;cursor:pointer}main{padding:25px 32px 35px;overflow:auto}.top{display:flex;align-items:center;gap:15px;margin-bottom:28px}.top button{background:#191d27;color:white;border:0;border-radius:50%;width:35px;height:35px;font-size:20px}.search{position:relative;max-width:460px;flex:1}.search input{width:100%;border:1px solid #2a3040;background:#171b24;color:white;border-radius:30px;padding:12px 17px;outline:none}.user{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:800}.avatar{background:linear-gradient(135deg,#9b87f5,#b7f36b);color:#10150a;border-radius:50%;width:34px;height:34px;display:grid;place-items:center}.hero{position:relative;overflow:hidden;padding:34px;border-radius:20px;min-height:245px;background:radial-gradient(circle at 80% 25%,#65538f,transparent 29%),linear-gradient(110deg,#202b35,#1b1b2d 65%,#3b2c51);border:1px solid #343244}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:2px;margin-bottom:11px}.hero h1{font-size:clamp(34px,4vw,51px);letter-spacing:-2px;line-height:1.02;margin:0 0 13px}.hero p{color:#c5c8d2;max-width:440px;line-height:1.5}.hero .disc{position:absolute;right:12%;top:40px;width:150px;height:150px;border-radius:25px;transform:rotate(9deg);background:linear-gradient(135deg,#b7f36b,#5a8567 50%,#36345c);display:grid;place-items:center;font-size:60px;box-shadow:0 20px 50px #0008}.head{display:flex;justify-content:space-between;align-items:end;margin:28px 0 15px}.head h2{font-size:21px;margin:0}.muted{color:var(--muted);font-size:12px;margin-top:6px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{padding:10px;border-radius:13px;cursor:pointer;min-width:0}.card:hover{background:#171b24}.cover{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:45px;position:relative;overflow:hidden}.cover:before{content:"";position:absolute;width:65%;height:65%;border:1px solid #ffffff55;border-radius:50%;box-shadow:0 0 0 15px #ffffff0b,0 0 0 30px #ffffff0b}.cover span{position:relative}.card h3{font-size:14px;margin:13px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{color:var(--muted);font-size:12px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{position:absolute;right:9px;bottom:9px;border:0;border-radius:50%;width:40px;height:40px;background:var(--green);font-size:17px;opacity:0;cursor:pointer}.card:hover .play{opacity:1}.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mood{background:#171b24;border-radius:10px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:13px;overflow:hidden;cursor:pointer}.mood span{width:52px;height:52px;display:grid;place-items:center;font-size:22px}.player{grid-column:2;background:#11141b;border-top:1px solid #292e39;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:12px 22px;gap:18px}.now{display:flex;align-items:center;gap:11px;min-width:0}.nowart{width:50px;height:50px;border-radius:8px;display:grid;place-items:center;font-size:23px;flex-shrink:0}.nowtitle{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowartist{color:var(--muted);font-size:11px;margin-top:5px}.like{background:transparent;border:0;color:#aab2c0;font-size:20px;cursor:pointer}.controls{display:flex;flex-direction:column;align-items:center;gap:7px}.buttons{display:flex;gap:19px;align-items:center}.buttons button{background:transparent;border:0;color:white;font-size:16px;cursor:pointer}.buttons .mainplay{background:white;color:#111;border-radius:50%;width:34px;height:34px}.progress{display:flex;align-items:center;gap:8px;color:#9099aa;font-size:10px;width:100%}.progress input{width:100%;accent-color:var(--green)}.volume{display:flex;justify-content:flex-end;align-items:center;gap:9px;color:#aab1bf}.volume input{width:90px;accent-color:var(--green)}.upload{display:none}.empty{border:1px dashed #3a4050;padding:28px;text-align:center;color:var(--muted);border-radius:14px;grid-column:1/-1}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .disc{right:5%;opacity:.5}.moods{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{grid-template-columns:62px 1fr;grid-template-rows:1fr auto}.side{padding:20px 7px;align-items:center}.brand{font-size:0;padding:0}.brand .logo{font-size:19px;margin:0}.label,.nav .txt,.hint,.user span{display:none}.nav{width:100%}.nav button{text-align:center;padding:13px 4px;font-size:18px}.nav button .txt{display:none}main{padding:16px 12px 25px}.hero{padding:25px 20px}.hero .disc{right:-15px;width:100px;height:100px;font-size:38px;opacity:.3}.hero h1{font-size:34px}.hero p{font-size:13px}.player{grid-column:1/3;grid-template-columns:1fr 1fr;padding:10px;gap:8px}.controls{grid-column:2;grid-row:1}.volume{display:none}.nowart{width:40px;height:40px}.buttons{gap:10px}.nowtitle{max-width:120px}.progress span{display:none}}
</style></head><body><div class="app">
<aside class="side"><div class="brand"><span class="logo">♫</span>Beat<b>Sync</b></div><section><div class="label">MENU</div><nav class="nav"><button class="active" data-view="home">⌂ &nbsp; <span class="txt">Home</span></button><button data-view="discover">⌕ &nbsp; <span class="txt">Discover</span></button><button data-view="library">▤ &nbsp; <span class="txt">Your Library</span></button><button data-view="liked">♡ &nbsp; <span class="txt">Liked Songs</span></button><button data-view="playlists">▧ &nbsp; <span class="txt">Playlists</span></button><button id="add">＋ &nbsp; <span class="txt">Add local music</span></button></nav></section><div class="hint"><b>Make it yours</b><p>Bring your own audio files and play them here.</p><button class="btn" id="add2">＋ Add music</button></div></aside>
<main><header class="top"><button id="home">‹</button><button id="discover">›</button><div class="search"><input id="search" placeholder="⌕  Search songs, artists, genres..."></div><div class="user"><div class="avatar">Z</div><span>Music lover</span></div></header><div id="content"></div><input id="files" class="upload" type="file" accept="audio/*" multiple></main>
<footer class="player"><div class="now"><div class="nowart" id="nowart" style="background:#38345f">♫</div><div style="min-width:0"><div class="nowtitle" id="nowtitle">Choose a track</div><div class="nowartist" id="nowartist">Your music starts here</div></div><button class="like" id="like">♡</button></div><div class="controls"><div class="buttons"><button id="shuffle">⤨</button><button id="prev">◀◀</button><button class="mainplay" id="toggle">▶</button><button id="next">▶▶</button><button id="repeat">↻</button></div><div class="progress"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="total">0:00</span></div></div><div class="volume">🔊 <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></div></footer></div><audio id="audio"></audio>
<script>
const $=s=>document.querySelector(s),audio=$('#audio'),grad=['linear-gradient(135deg,#42306c,#e55d87)','linear-gradient(135deg,#9e344a,#f8a13a)','linear-gradient(135deg,#c17a32,#f5d76e)','linear-gradient(135deg,#17627b,#68c5d4)','linear-gradient(135deg,#334f7c,#6c8ebf)','linear-gradient(135deg,#843f5d,#e69b9b)','linear-gradient(135deg,#376357,#b7c9a8)','linear-gradient(135deg,#b56a31,#f5c46b)'],emo=['🌃','🌆','🌻','🌊','🌙','🌅','🍃','🏔️'];
let songs=[],cur=-1,liked=new Set(JSON.parse(localStorage.getItem('bs-liked')||'[]')),history=JSON.parse(localStorage.getItem('bs-history')||'[]'),pls=JSON.parse(localStorage.getItem('bs-playlists')||'[]'),shuffle=false,repeat=false;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function time(s){return Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00'}function art(s){return s.art||grad[(Math.max(0,s.id-1))%8]}function em(s){return s.emoji||emo[Math.max(0,s.id-1)%8]}
async function init(){try{songs=(await(await fetch('/api/songs')).json()).map(s=>({...s,art:s.color,emoji:emo[s.id-1]}))}catch(e){songs=[['Midnight City','M83','Electronic'],['Blinding Lights','The Weeknd','Pop'],['Sunflower','Post Malone, Swae Lee','Chill'],['Ocean Eyes','Billie Eilish','Indie'],['Night Changes','One Direction','Pop'],['Heat Waves','Glass Animals','Indie'],['Agar Tum Saath Ho','Arijit Singh','Bollywood'],['Ilahi','Arijit Singh','Bollywood']].map((x,i)=>({id:i+1,title:x[0],artist:x[1],genre:x[2],art:grad[i],emoji:emo[i]}))}renderHome()}
function card(s){return `<article class="card" data-song="${s.id}"><div class="cover" style="background:${art(s)}"><span>${em(s)}</span><button class="play" data-song="${s.id}">▶</button></div><h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p></article>`}
function renderHome(){document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='home'));$('#content').innerHTML=`<section class="hero"><div class="eyebrow">YOUR SOUND. YOUR WORLD.</div><h1>Find your<br>next favourite.</h1><p>Good music for every mood. Discover something that feels like you.</p><button class="btn" id="start">▶ &nbsp; Start listening</button> <button class="btn" style="background:#ffffff17;color:white" id="explore">Explore</button><div class="disc">♫</div></section><div class="head"><div><h2>Made for your mood</h2><div class="muted">A little something for every moment</div></div></div><div class="moods">${[['Chill','☁️'],['Focus','◉'],['Bollywood','✦'],['Indie','♬']].map((m,i)=>`<div class="mood" data-genre="${m[0]}"><span style="background:${grad[i*2]}">${m[1]}</span>${m[0]}</div>`).join('')}</div><div class="head"><div><h2>Popular right now</h2><div class="muted">Tracks to get you started</div></div><button class="btn" id="all">View all</button></div><div class="cards">${songs.slice(0,4).map(card).join('')}</div><div class="head"><div><h2>Made for late nights</h2><div class="muted">Press play and let the world slow down</div></div></div><div class="cards">${songs.slice(4).map(card).join('')}</div>`;$('#start').onclick=()=>play(songs[0]);$('#explore').onclick=()=>view('discover');$('#all').onclick=()=>view('discover')}
function view(v){document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));let list=songs,title='Discover';if(v==='liked'){title='Liked Songs';list=songs.filter(s=>liked.has(s.id))}if(v==='library'){title='Your Library';list=songs.filter(s=>history.includes(s.id))}if(v==='playlists'){title='Your Playlists';$('#content').innerHTML=`<div class="eyebrow">YOUR COLLECTION</div><h1>${title}</h1><button class="btn" id="create">＋ Create playlist</button><div class="cards" id="results" style="margin-top:22px"></div>`;$('#create').onclick=()=>{let n=prompt('Playlist name?');if(n){pls.push({name:n,ids:[]});localStorage.setItem('bs-playlists',JSON.stringify(pls));view('playlists')}};$('#results').innerHTML=pls.length?pls.map((p,i)=>`<article class="card" style="cursor:default"><div class="cover" style="background:${grad[i%8]}">▧</div><h3>${esc(p.name)}</h3><p>${p.ids.length} tracks</p></article>`).join(''):'<div class="empty">Create your first playlist.</div>';return}$('#content').innerHTML=`<div class="eyebrow">BEATSYNC CATALOG</div><h1>${title}</h1><p class="muted">Browse tracks or search your music.</p><div class="cards" id="results" style="margin-top:20px">${list.length?list.map(card).join(''):'<div class="empty">Nothing here yet. Like or play some songs first.</div>'}</div>`}
function play(s){if(!s)return;cur=songs.findIndex(x=>x.id===s.id);if(cur<0){songs.unshift(s);cur=0}let t=songs[cur];$('#nowtitle').textContent=t.title;$('#nowartist').textContent=t.artist;$('#nowart').textContent=em(t);$('#nowart').style.background=art(t);$('#like').textContent=liked.has(t.id)?'♥':'♡';history=[t.id,...history.filter(x=>x!==t.id)].slice(0,30);localStorage.setItem('bs-history',JSON.stringify(history));if(t.src){audio.src=t.src;audio.play().catch(()=>{})}else{audio.pause();audio.removeAttribute('src');$('#toggle').textContent='▶';alert('This catalog item is a demo listing without bundled audio. Click “Add local music” to play an audio file from your computer.')}}function next(){if(!songs.length)return;play(songs[shuffle?Math.floor(Math.random()*songs.length):(cur+1)%songs.length])}
$('#content').addEventListener('click',e=>{let s=e.target.closest('[data-song]');if(s){play(songs.find(t=>String(t.id)===s.dataset.song));return}let g=e.target.closest('[data-genre]');if(g){search(g.dataset.genre);return}});
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>b.dataset.view==='home'?renderHome():view(b.dataset.view));$('#search').oninput=e=>{let q=e.target.value.toLowerCase();let list=songs.filter(s=>[s.title,s.artist,s.genre].join(' ').toLowerCase().includes(q));$('#content').innerHTML=`<div class="eyebrow">SEARCH</div><h1>Search results</h1><div class="cards" style="margin-top:20px">${list.length?list.map(card).join(''):'<div class="empty">No matches found.</div>'}</div>`};function search(q){$('#search').value=q;$('#search').dispatchEvent(new Event('input'))}
$('#home').onclick=renderHome;$('#discover').onclick=()=>view('discover');$('#add').onclick=$('#add2').onclick=()=>$('#files').click();$('#files').onchange=e=>{[...e.target.files].filter(f=>f.type.startsWith('audio/')).forEach(f=>songs.unshift({id:Date.now()+Math.random(),title:f.name.replace(/\.[^.]+$/,''),artist:'Local file',genre:'Local',src:URL.createObjectURL(f),emoji:'♫',art:grad[0]}));view('discover');alert('Local audio added. Select a track to play it.')};
$('#like').onclick=()=>{if(cur<0)return;let id=songs[cur].id;liked.has(id)?liked.delete(id):liked.add(id);localStorage.setItem('bs-liked',JSON.stringify([...liked]));$('#like').textContent=liked.has(id)?'♥':'♡'};
$('#toggle').onclick=()=>{if(cur<0)return play(songs[0]);if(!audio.src)return alert('Add a local audio file to hear playback.');audio.paused?audio.play():audio.pause()};audio.onplay=()=>$('#toggle').textContent='Ⅱ';audio.onpause=()=>$('#toggle').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration){$('#seek').value=audio.currentTime/audio.duration*100;$('#elapsed').textContent=time(audio.currentTime);$('#total').textContent=time(audio.duration)}};audio.onended=()=>repeat?(audio.currentTime=0,audio.play()):next();$('#seek').oninput=()=>{if(audio.duration)audio.currentTime=audio.value/100*audio.duration};$('#vol').oninput=()=>audio.volume=+$('#vol').value;$('#next').onclick=next;$('#prev').onclick=()=>play(songs[(cur-1+songs.length)%songs.length]);$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').style.color=shuffle?'var(--green)':'white'};$('#repeat').onclick=()=>{repeat=!repeat;$('#repeat').style.color=repeat?'var(--green)':'white'};init();
</script></body></html>
